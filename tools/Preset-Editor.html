<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini-Moon Preset Editor (JSON Only)</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: row;
      height: 100vh;
      margin: 0;
    }
    .panel {
      padding: 1rem;
      overflow: auto;
      width: 380px;
	  background: #a0b0a0;
    }
    #editor {
	  flex: 1;
	  background: #111;
      color: #10b020;
	  padding: 1rem;
	  font-family: monospace;
	  white-space: pre;
	  overflow-y: auto; 
	}
    label, input, select, button {
      display: block;
      margin-bottom: 0.5rem;
    }
    input[type="range"] {
      width: 100%;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
    }
    fieldset {
      border: 1px solid #888;
      margin-bottom: 1rem;
    }
	.action-bar {
	  display: flex;
	  justify-content: space-between;
	  align-items: center;
	  gap: 0.5rem;
	  margin-top: 0.5rem;
	}

	.action-bar button,
	.controls button {
	  flex: 1;
	  padding: 0.3rem;
	  font-size: 14px;
	}
	.button-like {
	   display: inline-block;
	   padding: 0.5rem 1rem;
	   background-color: #444;
	   color: #fff;
	   border: none;
	   border-radius: 4px;
	   cursor: pointer;
	   font-size: 12px;
	   transition: background-color 0.2s;
	}
	.button-like:hover {
	   background-color: #666;
	}

  </style>
</head>
<body>
  <div class="panel">
    <details open>
	  <summary>Oscillators</summary>
	  <div id="oscillators"></div>
		<button onclick="addOscillator()">➕ Add</button>
	</details>


    <details>
	  <summary>LFOs</summary>
	  <div id="lfos"></div>
		<button onclick="addLFO()">➕ Add</button>
	</details>


    <details>
      <summary>Envelope</summary>
      <label>Attack: <input type="range" id="envAttack" min="0" max="5" step="0.1" value="0.1" oninput="updateJSON()" /></label>
      <label>Decay: <input type="range" id="envDecay" min="0" max="5" step="0.1" value="0.3" oninput="updateJSON()" /></label>
      <label>Sustain: <input type="range" id="envSustain" min="0" max="1" step="0.1" value="0.7" oninput="updateJSON()" /></label>
      <label>Release: <input type="range" id="envRelease" min="0" max="5" step="0.1" value="0.9" oninput="updateJSON()" /></label>
    </details>

	<details>
	  <summary>Filters</summary>
	  <div id="filters"></div>
		<button onclick="addFilter()">➕ Add</button>
	</details>

	<details>
	  <summary>Effects</summary>
	  <div id="effects"></div>
		<button onclick="addEffect()">➕ Add</button>
	</details>


    <details>
      <summary>Master</summary>
      <label>Gain: <input type="range" id="masterGain" min="0" max="1" step="0.01" value="1" oninput="updateJSON()" /></label>
      <label>Pan: <input type="range" id="masterPan" min="-1" max="1" step="0.1" value="0" oninput="updateJSON()" /></label>
      <label>Glide Time: <input type="range" id="masterGlideTime" min="0" max="1" step="0.01" value="0" oninput="updateJSON()" /></label>
      <label><input type="checkbox" id="masterGlideEnabled" onchange="updateJSON()" /> Glide Enabled</label>
      <label>Pitch: <input type="range" id="masterPitch" min="-12" max="12" step="1" value="0" oninput="updateJSON()" /></label>
      <label>Tempo: <input type="range" id="masterTempo" min="30" max="300" step="1" value="120" oninput="updateJSON()" /></label>
      <label>Tremolo: <input type="range" id="masterTremolo" min="0" max="1" step="0.01" value="0" oninput="updateJSON()" /></label>
    </details>

    <hr />
    <input class="button-like" type="file" accept=".json" onchange="loadPreset(event)" />
	<div></div>
    <button class="button-like" onclick="savePreset()">Save as JSON</button>
  </div>

  <div id="editor">JSON preview will appear here</div>

<script>
let oscCount = 0, lfoCount = 0, filterCount = 0, effectCount = 0;

function updateJSON() {
  const data = { modules: collectPresetData() };
  document.getElementById("editor").textContent = JSON.stringify(data, null, 2);
}

function collectPresetData() {
  const getVal = id => document.getElementById(id)?.value;
  const getCheck = id => document.getElementById(id)?.checked;

  const oscillator = Array.from(document.querySelectorAll("#oscillators fieldset")).map(fs => ({
    name: fs.querySelector(".oscName").value,
    type: "OscillatorType." + fs.querySelector(".oscType").value,
    gain: parseFloat(fs.querySelector(".oscGain").value),
    detune: parseFloat(fs.querySelector(".oscDetune").value),
    pan: parseFloat(fs.querySelector(".oscPan").value)
  }));

  const lfo = Array.from(document.querySelectorAll("#lfos fieldset")).map(fs => ({
    name: fs.querySelector(".lfoName").value,
    assignment: "LFOAssignment." + fs.querySelector(".lfoAssign").value,
    target: fs.querySelector(".lfoTarget").value,
    frequency: parseFloat(fs.querySelector(".lfoFreq").value),
    depth: parseFloat(fs.querySelector(".lfoDepth").value),
    waveform: "LFOWaveform." + fs.querySelector(".lfoWave").value
  }));

  const filter = Array.from(document.querySelectorAll("#filters fieldset")).map(fs => ({
    name: fs.querySelector(".filterName").value,
    type: "FilterType." + fs.querySelector(".filterType").value,
    cutoff: parseFloat(fs.querySelector(".filterCutoff").value),
    resonance: parseFloat(fs.querySelector(".filterResonance").value)
  }));

  const effect = Array.from(document.querySelectorAll("#effects fieldset")).map(fs => {
    const type = fs.querySelector(".effectType").value;
    const obj = {
      name: fs.querySelector(".effectName").value,
      type: "EffectType." + type,
      mix: parseFloat(fs.querySelector(".effectMix").value),
      rate: parseFloat(fs.querySelector(".effectRate").value)
    };

    // Distortion mode (enum)
    if (type === "Distortion") {
      const mode = fs.querySelector(".effectMode");
      if (mode) obj.mode = "DistortionType." + mode.value;
    }

    return obj;
  });

  const envelope = {
    attack: parseFloat(getVal("envAttack")),
    decay: parseFloat(getVal("envDecay")),
    sustain: parseFloat(getVal("envSustain")),
    release: parseFloat(getVal("envRelease"))
  };

  const master = {
    gain: parseFloat(getVal("masterGain")),
    pan: parseFloat(getVal("masterPan")),
    pitch: parseFloat(getVal("masterPitch")),
    tempo: parseFloat(getVal("masterTempo")),
    tremolo: parseFloat(getVal("masterTremolo")),
	glide: {
	  time: parseFloat(getVal("masterGlideTime")),
	  enabled: getCheck("masterGlideEnabled")
	}
  };

  return { oscillator, lfo, envelope, filter, effect, master };
}


function loadPreset(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const modules = data.modules || data;
      fillUIFromPreset(modules);  // UI feltöltés
      updateJSON();               // JSON preview frissítés
    } catch (err) {
      alert("Error loading preset: " + err.message);
      console.error(err);
    }
  };
  reader.readAsText(file);
}


function savePreset() {
  const json = { modules: collectPresetData() };
  const blob = new Blob([JSON.stringify(json, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "preset.json";
  a.click();
  URL.revokeObjectURL(url);
}

function addOscillator() {
  const el = document.createElement("fieldset");
  el.innerHTML = `
    <legend>Oscillator ${++oscCount}</legend>
    <label>Name: <input class="oscName" value="OSC-${oscCount}"></label>
    <label>Type:
      <select class="oscType">
        <option>Sine</option><option>Square</option><option>Triangle</option><option>Saw</option>
      </select>
    </label>
    <label>Gain: <input type="range" class="oscGain" min="0" max="1" step="0.01" value="1" oninput="updateJSON()"></label>
    <label>Detune: <input type="range" class="oscDetune" min="-0.1" max="0.1" step="0.01" value="0" oninput="updateJSON()"></label>
    <label>Pan: <input type="range" class="oscPan" min="-1" max="1" step="0.1" value="0" oninput="updateJSON()"></label>
    <div class="controls">
      <button type="button" onclick="deleteModule(this)">✖</button>
    </div>
  `;
  document.getElementById("oscillators").appendChild(el);
  updateJSON();
}

function addLFO() {
  const el = document.createElement("fieldset");
  el.innerHTML = `
    <legend>LFO ${++lfoCount}</legend>
    <label>Name: <input class="lfoName" value="LFO-${lfoCount}"></label>
    <label>Assignment: <input class="lfoAssign" value="OscPitch"></label>
    <label>Target: <input class="lfoTarget" value="OSC-1"></label>
    <label>Frequency: <input type="range" class="lfoFreq" min="0.1" max="10" step="0.1" value="2" oninput="updateJSON()"></label>
    <label>Depth: <input type="range" class="lfoDepth" min="0" max="1" step="0.01" value="0.5" oninput="updateJSON()"></label>
    <label>Waveform:
      <select class="lfoWave">
        <option>Sine</option><option>Square</option><option>Triangle</option><option>Saw</option>
      </select>
	<div class="controls">
      <button type="button" onclick="deleteModule(this)">✖</button>
    </div>
    </label>
  `;
  document.getElementById("lfos").appendChild(el);
  updateJSON();
}

function addFilter() {
  const el = document.createElement("fieldset");
  el.innerHTML = `
    <legend>Filter ${++filterCount}</legend>
    <label>Name: <input class="filterName" value="FLT-${filterCount}"></label>
    <label>Type:
      <select class="filterType">
        <option>LowPass</option><option>HighPass</option><option>BandPass</option><option>Notch</option>
      </select>
    </label>
    <label>Cutoff: <input type="range" class="filterCutoff" min="20" max="20000" step="10" value="1000" oninput="updateJSON()"></label>
    <label>Resonance: <input type="range" class="filterResonance" min="0" max="1" step="0.01" value="0.5" oninput="updateJSON()"></label>
    <div class="controls">
      <button onclick="moveUp(this)">▲</button>
      <button onclick="moveDown(this)">▼</button>
      <button onclick="deleteModule(this)">✖</button>
    </div>
  `;
  document.getElementById("filters").appendChild(el);
  updateJSON();
}


function addEffect() {
  const container = document.getElementById("effects");
  const fs = document.createElement("fieldset");
  fs.innerHTML = `
    <legend>Effect ${++effectCount}</legend>
    <label>Name: <input class="effectName" value="FX-${effectCount}"></label>
    <label>Type:
      <select class="effectType" onchange="updateEffectUI(this)">
        <option>Reverb</option>
        <option>Delay</option>
        <option>Chorus</option>
        <option>Distortion</option>
      </select>
    </label>
    <div class="effectParams">
      <label>Mix: <input type="range" class="effectMix" min="0" max="1" step="0.01" value="0.5" oninput="updateJSON()"></label>
      <label>Rate: <input type="range" class="effectRate" min="0" max="10" step="0.1" value="2" oninput="updateJSON()"></label>
    </div>
	<div class="controls">
      <button onclick="moveUp(this)">▲</button>
      <button onclick="moveDown(this)">▼</button>
      <button onclick="deleteModule(this)">✖</button>
    </div>
  `;
  container.appendChild(fs);
  updateJSON();
}

// Frissíti a params UI-t a kiválasztott effectType alapján
function updateEffectUI(selectElem) {
  const type = selectElem.value;
  const paramsContainer = selectElem.closest("fieldset").querySelector(".effectParams");

  let html = `
    <label>Mix: <input type="range" class="effectMix" min="0" max="1" step="0.01" value="0.5" oninput="updateJSON()"></label>
    <label>Rate: <input type="range" class="effectRate" min="0" max="10" step="0.1" value="2" oninput="updateJSON()"></label>
  `;

  if (type === "Distortion") {
    html += `
      <label>Mode:
        <select class="effectMode" onchange="updateJSON()">
          <option>Fuzz</option>
          <option>Overdrive</option>
          <option>HardClip</option>
          <option>Bitcrusher</option>
        </select>
      </label>
    `;
  }

  paramsContainer.innerHTML = html;
  updateJSON();
}

function fillUIFromPreset(modules) {
  try {
    // Reset all dynamic module containers
    document.getElementById("oscillators").innerHTML = "";
    document.getElementById("lfos").innerHTML = "";
    document.getElementById("filters").innerHTML = "";
    document.getElementById("effects").innerHTML = "";

    // === Oscillators ===
    (modules.oscillator || []).forEach(o => {
      addOscillator();
      const fs = document.querySelector("#oscillators fieldset:last-child");
      fs.querySelector(".oscName").value = o.name || "";
      fs.querySelector(".oscType").value = (o.type || "").split(".").pop();  // Remove enum prefix
      fs.querySelector(".oscGain").value = o.gain ?? 1;
      fs.querySelector(".oscDetune").value = o.detune ?? 0;
      fs.querySelector(".oscPan").value = o.pan ?? 0;
    });

    // === LFOs (optional) ===
    (modules.lfo || []).forEach(l => {
      addLFO();
      const fs = document.querySelector("#lfos fieldset:last-child");
      fs.querySelector(".lfoName").value = l.name || "";
      fs.querySelector(".lfoAssign").value = (l.assignment || "").split(".").pop();
      fs.querySelector(".lfoTarget").value = l.target || "";
      fs.querySelector(".lfoFreq").value = l.frequency ?? 1;
      fs.querySelector(".lfoDepth").value = l.depth ?? 0.5;
      fs.querySelector(".lfoWave").value = (l.waveform || "").split(".").pop();
    });

    // === Envelope ===
    const e = modules.envelope || {};
    document.getElementById("envAttack").value = e.attack ?? 0.1;
    document.getElementById("envDecay").value = e.decay ?? 0.1;
    document.getElementById("envSustain").value = e.sustain ?? 0.7;
    document.getElementById("envRelease").value = e.release ?? 0.3;

    // === Filters (optional) ===
    (modules.filter || []).forEach(f => {
      addFilter();
      const fs = document.querySelector("#filters fieldset:last-child");
      fs.querySelector(".filterName").value = f.name || "";
      fs.querySelector(".filterType").value = (f.type || "").split(".").pop();
      fs.querySelector(".filterCutoff").value = f.cutoff ?? 1000;
      fs.querySelector(".filterResonance").value = f.resonance ?? 0.5;
    });

    // === Effects (optional) ===
    (modules.effect || []).forEach(eff => {
      addEffect();
      const fs = document.querySelector("#effects fieldset:last-child");
      fs.querySelector(".effectName").value = eff.name || "";
      const type = (eff.type || "").split(".").pop();
      const typeSelect = fs.querySelector(".effectType");
      typeSelect.value = type;

      updateEffectUI(typeSelect); // force UI refresh for distortion mode if needed

      fs.querySelector(".effectMix").value = eff.mix ?? 0.5;
      fs.querySelector(".effectRate").value = eff.rate ?? 1;

      if (type === "Distortion" && eff.mode) {
        const mode = (eff.mode || "").split(".").pop();
        const modeSelect = fs.querySelector(".effectMode");
        if (modeSelect) modeSelect.value = mode;
      }
    });

    // === Master ===
    const m = modules.master || {};
    document.getElementById("masterGain").value = m.gain ?? 1;
    document.getElementById("masterPan").value = m.pan ?? 0;
    document.getElementById("masterGlideTime").value = m.glide?.time ?? 0;
    document.getElementById("masterGlideEnabled").checked = m.glide?.enabled ?? false;
    document.getElementById("masterPitch").value = m.pitch ?? 0;
    document.getElementById("masterTempo").value = m.tempo ?? 120;
    document.getElementById("masterTremolo").value = m.tremolo ?? 0;

    updateJSON();
  } catch (err) {
    alert("Failed to load preset into UI: " + err.message);
    console.error("fillUIFromPreset error:", err);
  }
}

function moveUp(button) {
  const fieldset = button.closest("fieldset");
  const parent = fieldset.parentNode;
  const prev = fieldset.previousElementSibling;
  if (prev) parent.insertBefore(fieldset, prev);
  updateJSON();
}

function moveDown(button) {
  const fieldset = button.closest("fieldset");
  const parent = fieldset.parentNode;
  const next = fieldset.nextElementSibling?.nextElementSibling;
  if (next) parent.insertBefore(next, fieldset);
  else parent.appendChild(fieldset);
  updateJSON();
}

function deleteModule(button) {
  const fieldset = button.closest("fieldset");
  fieldset.remove();
  updateJSON();
}



// Inicializálás
updateJSON();
</script>
</body>
</html>
